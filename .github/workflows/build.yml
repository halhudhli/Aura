name: Build Aura APK

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "README.md" ]
  workflow_dispatch:

concurrency:
  group: build-aura-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -Paura.versionName=1.0.${{ github.run_number }} \
            -Paura.versionCode=$((1000 + ${{ github.run_number }})) \
            --stacktrace 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e: |error: |AAPT|What went wrong' -A3 build.log | sed 's#.*/app/src/#src/#' | head -120 > errs.txt || true
          split -l 10 errs.txt errpart_ || true
          for f in errpart_*; do
            [ -s "$f" ] && echo "::error::$(sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g' "$f")"
          done

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "Aura-${VERSION}.apk"
          gh release create "v${VERSION}" "Aura-${VERSION}.apk" \
            --title "Aura ${VERSION}" \
            --notes "Aura ${VERSION} — مشغّل فيديو للأندرويد بلا إعلانات." \
            --target "${{ github.sha }}"
          gh release list --limit 100 --json tagName -q '.[5:][].tagName' | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done
