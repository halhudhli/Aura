name: Build Aura APK

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "README.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "README.md" ]
  workflow_dispatch:
    inputs:
      verify_subtitles_api:
        description: Verify live title and subtitle searches using configured addons (no download)
        type: boolean
        default: false

concurrency:
  group: build-aura-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build emulator APK
        run: bash gradlew :app:assembleDebug -Paura.emulator=true --max-workers=2
      - name: Create media fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p smoke-fixtures
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 45 -c:v libx264 -pix_fmt yuv420p -c:a aac smoke-fixtures/AuraSmoke.mp4
          ffmpeg -loglevel error -f lavfi -i sine=frequency=220:sample_rate=44100 -t 90 -c:a libmp3lame smoke-fixtures/AuraTone.mp3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise tablet, phone, video and background audio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/android_smoke.py
      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Android-smoke-${{ github.run_number }}
          path: smoke-results/
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        env:
          SUBSENSE_API_KEY: ${{ secrets.SUBSENSE_API_KEY }}
          OPENSUBTITLESPRO_API_KEY: ${{ secrets.OPENSUBTITLESPRO_API_KEY }}
          AURA_LIVE_SUBTITLE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_subtitles_api && 'true' || 'false' }}
        run: |
          set -o pipefail
          if [ -n "$SUBSENSE_API_KEY" ]; then
            echo "SubSense manifest: configured"
          else
            echo "::notice::SubSense manifest is missing."
          fi
          if [ -n "$OPENSUBTITLESPRO_API_KEY" ]; then
            echo "OpenSubtitles PRO manifest: configured"
          else
            echo "::notice::OpenSubtitles PRO manifest is missing."
          fi
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            -Paura.versionName=1.0.${{ github.run_number }} \
            -Paura.versionCode=$((1000 + ${{ github.run_number }})) \
            --stacktrace 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e: |error: |AAPT|What went wrong' -A3 build.log | sed 's#.*/app/src/#src/#' | head -120 > errs.txt || true
          split -l 10 errs.txt errpart_ || true
          for f in errpart_*; do
            [ -s "$f" ] && echo "::error::$(sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g' "$f")"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aura-checks-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*

      - name: Upload preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aura-preview-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish release
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "Aura-${VERSION}.apk"
          gh release create "v${VERSION}" "Aura-${VERSION}.apk" \
            --title "Aura ${VERSION}" \
            --notes "Aura ${VERSION} — مشغّل فيديو للأندرويد بلا إعلانات." \
            --target "${{ github.sha }}"
          gh release list --limit 100 --json tagName -q '.[5:][].tagName' | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done
